<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUPG</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="page">
        <div class="main">
            <div class="banner">
                <img class="profile-photo" alt="profile photo" />
                <div>
                    <div id="user-name" class="name"></div>
                    <div id="user-location"></div>
                </div>
            </div>


            <div class="quote section">
                <div class="label">Favorite quote:</div>
                <div id="quote-text"></div>
                <div id="quote-author"></div>
            </div>


            <div class="pokemon section">
                <img id="pokemon-img" alt="Pokemon" />
                <div>Favorite Pokemon: <span id="pokemon-name"></span></div>
            </div>

            <hr class="divider" />

            <div class="about-me section">
                <div class="label">About me</div>
                <div id="about-text"></div>
            </div>

            <div class="buttons">
                <button class="btn generate">Generate User</button>
            </div>
        </div>
        <aside class="friends">
            <div class="friends-title">Friends</div>
            <ul id="friends-list"></ul>
        </aside>
    </div>


</body>

</html>
